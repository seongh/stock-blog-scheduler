name: "🌙 평일 저녁 - 한국 마감 & 미국 프리마켓"

on:
  # 자동 스케줄 비활성화 (비용 절감) — 수동 실행만 가능
  workflow_dispatch:
    inputs:
      dry_run:
        description: "테스트 실행 (결과 커밋 안 함)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  run-blog:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 패키지 설치
        run: pip install anthropic selenium

      - name: 블로그 작성 실행
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python run_task.py stock-blog-evening

      - name: 네이버 블로그 포스팅
        env:
          NAVER_ID: ${{ secrets.NAVER_ID }}
          NAVER_PW: ${{ secrets.NAVER_PW }}
        run: python naver_post.py

      - name: 결과 커밋 & 푸시
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "Stock Blog Bot"
          git config user.email "bot@noreply.github.com"
          git add outputs/
          git diff --staged --quiet || git commit -m "🌙 [평일 저녁] 한국마감 & 미국프리마켓 $(date -d '9 hours' +'%Y-%m-%d')"
          git push
