name: "☀️ 주말 오후 - 글로벌 동향 & 섹터 분석"

on:
  schedule:
    # 13:03 KST (Sat+Sun) = 04:03 UTC (Sat+Sun)
    - cron: "3 4 * * 0,6"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "테스트 실행 (결과 커밋 안 함)"
        type: boolean
        default: false

jobs:
  run-blog:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 패키지 설치
        run: pip install anthropic

      - name: 블로그 작성 실행
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python run_task.py stock-blog-monday-noon

      - name: 결과 커밋 & 푸시
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "Stock Blog Bot"
          git config user.email "bot@noreply.github.com"
          git add outputs/
          git diff --staged --quiet || git commit -m "☀️ [주말 오후] 글로벌 동향 & 섹터 $(date -d '9 hours' +'%Y-%m-%d')"
          git push
